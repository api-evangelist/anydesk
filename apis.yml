aid: anydesk
name: AnyDesk
description: >-
  AnyDesk is a German remote desktop and remote access software company whose
  clients provide cross-platform remote control, unattended access, remote
  support and file transfer for Windows, macOS, Linux, Android and iOS. For
  administrators, the my.anydesk management console centralizes license,
  client, address book and session management, and exposes a JSON-over-HTTPS
  REST API (my.anydesk I REST API, v1.1.1) that automates retrieval and
  management of account data — license and account details, registered
  clients, session history and comments, aliases and address books — so teams
  can integrate AnyDesk with billing, ticketing and session-logging systems.
  AnyDesk ships an official open-source Python library for the API and supports
  SSO/SAML for console access.
