apis:
- name: AnyDesk REST API
  description: >-
    The my.anydesk I REST API automates retrieval and management of AnyDesk
    account data from the my.anydesk management console: license and account
    details, registered clients and their aliases/online status, session
    history and detailed session data, session comments, closing active
    sessions, and listing address books. Authenticated with a License ID and
    API Password in a request header.
